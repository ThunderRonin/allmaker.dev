<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_5 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_5" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_5');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js Option A: Hyper-Toroidal Kernel Reactor & Multi-Ring Bus
// Calibrated for deep OLED blacks, high-concurrency systems aesthetic, and laser-crimson filaments

const getWidth = () => container.clientWidth || window.innerWidth || 390;
const getHeight = () => container.clientHeight || window.innerHeight || 844;

let width = getWidth();
let height = getHeight();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, width / height, 0.1, 1000);
camera.position.set(0, 0, 160);

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
container.appendChild(renderer.domElement);

const coreGroup = new THREE.Group();
scene.add(coreGroup);

// 1. Inner Core: Wireframe Icosahedron / Geodesic Kernel Node
const coreGeo = new THREE.IcosahedronGeometry(22, 2);
const coreWire = new THREE.WireframeGeometry(coreGeo);
const coreMat = new THREE.LineBasicMaterial({
  color: 0xff1744,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  linewidth: 1.5
});
const coreMesh = new THREE.LineSegments(coreWire, coreMat);
coreGroup.add(coreMesh);

// 1b. High-density Core Vertices (Glowing Node Vertices)
const corePointsMat = new THREE.PointsMaterial({
  color: 0xff3b5c,
  size: 3.2,
  transparent: true,
  opacity: 0.95,
  blending: THREE.AdditiveBlending
});
const corePoints = new THREE.Points(coreGeo, corePointsMat);
coreGroup.add(corePoints);

// 2. Toroidal Magnetic Containment Lattice (Wireframe Hyper-Torus)
const torusGeo = new THREE.TorusGeometry(48, 14, 20, 60);
const torusWire = new THREE.WireframeGeometry(torusGeo);
const torusMat = new THREE.LineBasicMaterial({
  color: 0x991b1b,
  transparent: true,
  opacity: 0.45,
  blending: THREE.AdditiveBlending
});
const torusMesh = new THREE.LineSegments(torusWire, torusMat);
torusMesh.rotation.x = Math.PI / 3;
coreGroup.add(torusMesh);

// 3. Counter-Rotating Orbital Data Ring 1 (Inner Bus)
const ring1Geo = new THREE.TorusGeometry(72, 0.8, 8, 80);
const ring1Mat = new THREE.LineBasicMaterial({
  color: 0x3b1117,
  transparent: true,
  opacity: 0.75,
  blending: THREE.AdditiveBlending
});
const ring1 = new THREE.Line(ring1Geo, ring1Mat);
ring1.rotation.x = Math.PI / 2.2;
ring1.rotation.y = Math.PI / 6;
coreGroup.add(ring1);

// 4. Outer Telemetry Segmented Orbital Bus (Segmented Nodes)
const ring2Geo = new THREE.TorusGeometry(96, 1.2, 8, 90);
const ring2Mat = new THREE.LineDashedMaterial({
  color: 0xff1744,
  dashSize: 4,
  gapSize: 6,
  transparent: true,
  opacity: 0.65,
  blending: THREE.AdditiveBlending
});
const ring2 = new THREE.Line(ring2Geo, ring2Mat);
ring2.computeLineDistances();
ring2.rotation.x = -Math.PI / 2.6;
ring2.rotation.y = -Math.PI / 8;
coreGroup.add(ring2);

// 5. High-Velocity High-Throughput Packet Tracer Particles
const PACKET_COUNT = 160;
const packetGeo = new THREE.BufferGeometry();
const packetPositions = new Float32Array(PACKET_COUNT * 3);
const packetColors = new Float32Array(PACKET_COUNT * 3);
const packetVelocities = [];

for (let i = 0; i < PACKET_COUNT; i++) {
  const i3 = i * 3;
  // Distribute along orbital radii
  const radius = 30 + Math.random() * 85;
  const theta = Math.random() * Math.PI * 2;
  const phi = (Math.random() - 0.5) * Math.PI * 0.8;

  packetPositions[i3] = radius * Math.cos(theta) * Math.cos(phi);
  packetPositions[i3 + 1] = radius * Math.sin(phi);
  packetPositions[i3 + 2] = radius * Math.sin(theta) * Math.cos(phi);

  packetVelocities.push({
    radius: radius,
    theta: theta,
    phi: phi,
    speed: 0.015 + Math.random() * 0.035,
    wobble: Math.random() * 2
  });

  // Hot crimson and cold phosphor highlights
  if (Math.random() < 0.35) {
    packetColors[i3] = 1.0; packetColors[i3 + 1] = 0.09; packetColors[i3 + 2] = 0.27; // Laser crimson
  } else if (Math.random() < 0.6) {
    packetColors[i3] = 0.6; packetColors[i3 + 1] = 0.05; packetColors[i3 + 2] = 0.12; // Dark ruby
  } else {
    packetColors[i3] = 0.3; packetColors[i3 + 1] = 0.32; packetColors[i3 + 2] = 0.38; // Cold graphite slate
  }
}

packetGeo.setAttribute('position', new THREE.BufferAttribute(packetPositions, 3));
packetGeo.setAttribute('color', new THREE.BufferAttribute(packetColors, 3));

const packetMat = new THREE.PointsMaterial({
  size: 2.8,
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  blending: THREE.AdditiveBlending
});
const packetCloud = new THREE.Points(packetGeo, packetMat);
coreGroup.add(packetCloud);

// Mouse and Touch Interaction
let mouseX = 0, mouseY = 0;
let targetMouseX = 0, targetMouseY = 0;

window.addEventListener('mousemove', (e) => {
  targetMouseX = (e.clientX / width - 0.5) * 2;
  targetMouseY = -(e.clientY / height - 0.5) * 2;
});

window.addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) {
    targetMouseX = (e.touches[0].clientX / width - 0.5) * 2;
    targetMouseY = -(e.touches[0].clientY / height - 0.5) * 2;
  }
}, { passive: true });

// Scroll reactivity: Modulates core dilation, rotation spin, and field of depth
let scrollRatio = 0;
function onScroll() {
  const scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
  const docHeight = (document.documentElement.scrollHeight - window.innerHeight) || 1;
  scrollRatio = Math.min(Math.max(scrollY / docHeight, 0), 1);
}
window.addEventListener('scroll', onScroll, { passive: true });

// Window resize
function onResize() {
  width = getWidth();
  height = getHeight();
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
}
window.addEventListener('resize', onResize);

// Render loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  const delta = clock.getDelta();

  // Smooth mouse interpolation
  mouseX += (targetMouseX - mouseX) * 0.05;
  mouseY += (targetMouseY - mouseY) * 0.05;

  // Reactivity to scroll & mouse
  const spinSpeed = 1.0 + scrollRatio * 2.8;
  coreMesh.rotation.x = time * 0.35 * spinSpeed;
  coreMesh.rotation.y = time * 0.55 * spinSpeed;
  corePoints.rotation.x = coreMesh.rotation.x;
  corePoints.rotation.y = coreMesh.rotation.y;

  // Pulsing scale for the inner reactor
  const pulse = 1.0 + Math.sin(time * 3.5) * 0.06 + scrollRatio * 0.15;
  coreMesh.scale.set(pulse, pulse, pulse);
  corePoints.scale.set(pulse, pulse, pulse);

  // Torus rotation
  torusMesh.rotation.y = -time * 0.22 * spinSpeed;
  torusMesh.rotation.z = time * 0.18;

  // Rings counter-rotation
  ring1.rotation.z = time * 0.45 * spinSpeed;
  ring2.rotation.z = -time * 0.30 * spinSpeed;

  // Group parallax shift
  coreGroup.rotation.y = mouseX * 0.45;
  coreGroup.rotation.x = -mouseY * 0.35;
  coreGroup.position.y = -scrollRatio * 25;

  // Animate packet tracer particles along orbital vectors
  const positions = packetGeo.attributes.position.array;
  for (let i = 0; i < PACKET_COUNT; i++) {
    const p = packetVelocities[i];
    p.theta += p.speed * spinSpeed;
    const r = p.radius + Math.sin(time * 2.0 + p.wobble) * 4.0;
    const i3 = i * 3;
    positions[i3] = r * Math.cos(p.theta) * Math.cos(p.phi);
    positions[i3 + 1] = r * Math.sin(p.phi) + Math.cos(time + p.theta) * 2;
    positions[i3 + 2] = r * Math.sin(p.theta) * Math.cos(p.phi);
  }
  packetGeo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
}

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_5 -->
</body>
</html>
